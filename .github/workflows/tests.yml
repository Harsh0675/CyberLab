name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile
        run: python -m py_compile cyberlab.py modules/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v